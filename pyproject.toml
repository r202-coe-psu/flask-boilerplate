[project]
name = "app-name"
version = "0.1.0"
description = "Flask + MongoEngine + RQ + HTMX/Tailwind starter"
authors = []
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-mongoengine-3 (>=1.1.0,<2.0.0)",
    "flask-login (>=0.6.3,<0.7.0)",
    "flask-wtf (>=1.2.2,<2.0.0)",
    "flask-caching (>=2.3.1,<3.0.0)",
    "authlib (>=1.6.5,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rq (>=2.6.0,<3.0.0)",
    "redis (>=5.0.0,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
]

[tool.poetry]
packages = [{ include = "app_name" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
mongomock = "^4.3"
ruff = "^0.13"

[tool.poetry.scripts]
app-web = "app_name.cmd.web:main"
app-worker = "app_name.cmd.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["app_name/web/static"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
