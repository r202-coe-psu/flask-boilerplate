<!DOCTYPE html>
<html lang="th" data-theme="app">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.APP_TITLE }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ 'css/app.css' | static_url }}">
    <link rel="stylesheet" href="{{ 'node_modules/@phosphor-icons/web/src/regular/style.css' | static_url }}">
    <link rel="stylesheet" href="{{ 'node_modules/@phosphor-icons/web/src/fill/style.css' | static_url }}">
    <script src="{{ 'node_modules/htmx.org/dist/htmx.min.js' | static_url }}"></script>
    <script src="{{ 'node_modules/jquery/dist/jquery.min.js' | static_url }}"></script>
    {% block head %}
    {% endblock head %}
  </head>

  <body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
    {% block body %}
    {% endblock body %}

    {% block js %}
    {% endblock js %}
  </body>

</html>
