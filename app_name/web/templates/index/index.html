{% extends "base/default_page.html" %}

{% set title_page = "หน้าแรก" %}

{% block content %}
<div class="hero bg-base-0 rounded-box py-16">
  <div class="hero-content text-center">
    <div class="max-w-md">
      <h1 class="text-4xl font-bold">{{ config.APP_TITLE }}</h1>
      <p class="py-6 text-base-content/70">Flask + MongoEngine + HTMX + Tailwind/DaisyUI starter</p>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">ไปที่แดชบอร์ด</a>
      {% else %}
      <a href="{{ url_for('accounts.login') }}" class="btn btn-primary">เข้าสู่ระบบ</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock content %}
